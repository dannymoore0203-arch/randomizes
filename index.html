<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Генератор 19 команд</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{font:16px system-ui,Arial;background:#f6f5fa;color:#242233;margin:0}main{max-width:1100px;margin:auto;padding:35px 20px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em}p{color:#666}header{margin-bottom:30px}.uploads,.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.upload,.team{background:white;border-radius:18px;padding:22px}.upload{border:2px dashed #b9b2dc;cursor:pointer}.upload b{display:block;margin-bottom:10px}.upload input{width:100%;margin-top:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button{border:0;border-radius:12px;padding:14px 20px;background:#6c4ee9;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.team h2{margin-top:0;font-size:20px}.team ol{line-height:1.8;padding-left:25px}#status{margin:15px 0;color:#4d397d}@media(min-width:900px){.teams{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.uploads,.teams{grid-template-columns:1fr}}@media print{.uploads,.actions,header p{display:none}.teams{grid-template-columns:repeat(2,1fr)}.team{break-inside:avoid}}</style><main><header><h1>Генератор 19 команд</h1><p>Загрузите Excel с 19 капитанами и Excel с участниками. Каждый человек попадёт только в одну команду.</p></header><section class="uploads"><label class="upload"><b>1. Капитаны</b><input id="captains" type="file" accept=".xlsx,.xls,.csv"></label><label class="upload"><b>2. Участники</b><input id="members" type="file" accept=".xlsx,.xls,.csv"></label></section><div class="actions"><button id="generate">Сформировать команды</button><button id="download" disabled>Скачать Excel</button><button id="print" disabled>Печать</button></div><div id="status" role="status"></div><section id="teams" class="teams"></section></main><script>
const el=id=>document.getElementById(id);let groups=[];const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>s.toLocaleLowerCase('ru').replace(/ё/g,'е').replace(/\s+/g,' ').trim();
function reset(){groups=[];el('teams').innerHTML='';el('download').disabled=true;el('print').disabled=true}['captains','members'].forEach(id=>el(id).addEventListener('change',reset));
function names(rows){let data=rows.map(r=>r.map(x=>String(x??'').trim())).filter(r=>r.some(Boolean));if(!data.length)return[];const h=data[0].map(norm),f=h.findIndex(x=>/^(фио|ф\.и\.о\.|полное имя)$/.test(x)),s=h.findIndex(x=>/фамил/.test(x)),n=h.findIndex(x=>/^имя$/.test(x)),p=h.findIndex(x=>/отчеств/.test(x));const start=f>=0||s>=0||n>=0?1:0;return data.slice(start).map(r=>f>=0?r[f]:(s>=0||n>=0?[s>=0?r[s]:'',n>=0?r[n]:'',p>=0?r[p]:''].join(' '):r.slice(0,3).join(' '))).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean)}
async function read(file){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return names(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',blankrows:false}))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const b=new Uint32Array(1);crypto.getRandomValues(b);const j=b[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
el('generate').onclick=async()=>{reset();try{if(typeof XLSX==='undefined')throw Error('Не загрузилась библиотека Excel. Проверьте интернет.');const c=el('captains').files[0],m=el('members').files[0];if(!c||!m)throw Error('Загрузите оба файла.');const capt=await read(c),members=await read(m);if(capt.length!==19)throw Error('Нужно 19 капитанов, найдено '+capt.length);if(!members.length)throw Error('Список участников пуст.');const all=[...capt,...members].map(norm),seen=new Set(),duplicates=[];for(const name of all){if(seen.has(name))duplicates.push(name);seen.add(name)}if(duplicates.length)throw Error('Повторяющиеся ФИО: '+[...new Set(duplicates)].slice(0,5).join(', '));groups=capt.map((captain,i)=>({number:i+1,captain,members:[]}));shuffle(members).forEach((name,i)=>groups[i%19].members.push(name));const check=groups.flatMap(g=>[g.captain,...g.members]);if(check.length!==all.length||new Set(check.map(norm)).size!==all.length)throw Error('Проверка распределения не пройдена');el('teams').innerHTML=groups.map(g=>'<article class="team"><h2>Команда '+g.number+'</h2><ol>'+[g.captain,...g.members].map(n=>'<li>'+safe(n)+'</li>').join('')+'</ol></article>').join('');el('status').textContent='Готово: 19 команд, '+members.length+' участников и 19 капитанов. Повторов нет.';el('download').disabled=false;el('print').disabled=false}catch(e){reset();el('status').textContent='Ошибка: '+e.message}};
el('download').onclick=()=>{if(!groups.length)return;const wb=XLSX.utils.book_new(),rows=[['Команда','ФИО']];groups.forEach(g=>[g.captain,...g.members].forEach(n=>rows.push(['Команда '+g.number,n])));const sh=XLSX.utils.aoa_to_sheet(rows);sh['!cols']=[{wch:20},{wch:55}];XLSX.utils.book_append_sheet(wb,sh,'Все команды');groups.forEach(g=>{const s=XLSX.utils.aoa_to_sheet([['ФИО'],...[g.captain,...g.members].map(n=>[n])]);s['!cols']=[{wch:55}];XLSX.utils.book_append_sheet(wb,s,'Команда '+g.number)});XLSX.writeFile(wb,'19_команд.xlsx')};
el('print').onclick=()=>{if(!groups.length)return;window.print()};
</script></html>
